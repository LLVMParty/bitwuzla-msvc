name: Build MSVC static

# Manually dispatched only -- no push/PR autobuild. Builds the MSVC static
# archive and publishes it to a GitHub release on this repo, where smt-server's
# `bitwuzla` cargo feature (build.rs) fetches it:
#   releases/download/<release_tag>/Bitwuzla-Win64-x86_64-msvc-static.zip
"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the MSVC static zip under"
        required: true
        default: "bitwuzla-msvc-0.9.1"

permissions:
  contents: write   # gh release create/upload writes releases + tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install meson/ninja
        run: pip install meson ninja

      - name: Restore vcpkg installed
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: 'C:\vcpkg\installed'
          key: vcpkg-gmp-mpfr-pkgconf-staticmd-v3-${{ hashFiles('ci/triplets/*') }}

      - name: Install deps (gmp/mpfr static-md + pkgconf)
        id: install-deps
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          vcpkg install gmp mpfr --triplet x64-windows-static-md --overlay-triplets ci\triplets
          if errorlevel 1 exit /b 1
          vcpkg install pkgconf:x64-windows
          if errorlevel 1 exit /b 1

      - name: Save vcpkg installed
        if: always() && steps.install-deps.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: 'C:\vcpkg\installed'
          key: vcpkg-gmp-mpfr-pkgconf-staticmd-v3-${{ hashFiles('ci/triplets/*') }}

      - name: Build bitwuzla (lib + CLI)
        shell: cmd
        run: |
          call build_msvc.bat
          if errorlevel 1 exit /b 1
        env:
          VCPKG_INSTALLED: 'C:\vcpkg\installed\x64-windows-static-md'
          VCPKG_TOOLS: 'C:\vcpkg\installed\x64-windows\tools\pkgconf'

      - name: Assemble release zip
        shell: cmd
        run: |
          call assemble_msvc_zip.bat
          if errorlevel 1 exit /b 1
        env:
          VCPKG: 'C:\vcpkg\installed\x64-windows-static-md'

      - name: Smoke-test the CLI
        shell: cmd
        run: 'build_msvc\src\main\bitwuzla.exe --version'

      - uses: actions/upload-artifact@v4
        with:
          name: Bitwuzla-Win64-x86_64-msvc-static
          path: msvc_pkg/Bitwuzla-Win64-x86_64-msvc-static.zip
          if-no-files-found: error

      - name: Run regression tests
        shell: cmd
        run: |
          call test_msvc.bat
          if errorlevel 1 exit /b 1
        env:
          VCPKG_INSTALLED: 'C:\vcpkg\installed\x64-windows-static-md'
          VCPKG_TOOLS: 'C:\vcpkg\installed\x64-windows\tools\pkgconf'

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          asset="msvc_pkg/Bitwuzla-Win64-x86_64-msvc-static.zip"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; uploading asset (clobber)."
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "$asset"
          else
            echo "Creating release $RELEASE_TAG."
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "Bitwuzla MSVC static ($RELEASE_TAG)" \
              --notes "Prebuilt MSVC static archive rebuilt from Bitwuzla 0.9.1 source under cl.exe (x64-windows-static-md triplet, static GMP/MPFR, /MD CRT). Consumed by smt-server's bitwuzla cargo feature." \
              "$asset"
          fi
