# Meson native file for building bitwuzla with MSVC (cl.exe).
#
# This is an ADDITIVE port config: it does not modify upstream meson.build or
# any upstream source, so it survives upstream merges without conflict. The
# two unavoidable source fixes (src/util/integer.h <string> include,
# src/main/time_limit.cpp pthread guard) are kept as a minimal, upstreamable
# patch.
#
# /D__WIN32        cadical gates its entire Windows implementation on
#                 `#ifdef __WIN32`; MSVC defines _WIN32 but NOT __WIN32, so we
#                 define it here. (symfpu/bitwuzla are __WIN32-agnostic.)
# /FImsvc_compat.h force-include the GCC-builtin / __attribute__ / POSIX
#                 polyfills in msvc_shim/. Resolved via the INCLUDE path that
#                 build_msvc.bat prepends (msvc_shim/); the same path serves
#                 cadical's `#include <unistd.h>`.
# pkg-config       vcpkg ships pkgconf.exe; build_msvc.bat exposes it on PATH
#                 as pkg-config.exe.
#
# c_args/cpp_args here apply to EVERY TU in the build, including subprojects
# (cadical, symfpu) -- which is why a native file is used instead of
# add_project_arguments (the latter would not reach subprojects).
#
# Usage:
#   build_msvc.bat              # sets up env + invokes meson with this file
#   meson setup build --native-file msvc_native.ini ...
[built-in options]
c_args   = ['/D__WIN32', '/FImsvc_compat.h']
cpp_args = ['/D__WIN32', '/FImsvc_compat.h']

[binaries]
pkg-config = 'pkg-config'
